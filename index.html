<style>

<p class="sub">每一季一個點。滑鼠移上去，看每一區從基準季到那一季漲了多少。</p>

  </div>
</div>
<p class="key" id="key"></p>

<script>/*
 * 資料取得層：
 *   1. readEmbeddedData()：讀出 build.py 嵌在頁面裡的 JSON。
 *   2. validateData()：檢查格式，壞掉的部分丟掉並記下警告，整份不能用時回傳 error。
 *   3. loadChartLib()：載入 Chart.js，CDN 失敗或逾時就改用 repo 裡的備份檔。
 * validateData 是純函式，Node 測試可直接 require()。
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.HousingData = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const QUARTER_RE = /^\d{4}Q[1-4]$/;
  const COLOR_RE = /^#[0-9a-fA-F]{6}$/;
  const FALLBACK_COLOR = '#898781';
  const VIEW_IDS = ['m2', 'cbs'];

  /** 數字或 null 以外的值一律當缺值 */
  const cleanValue = v => (typeof v === 'number' && Number.isFinite(v) ? v : null);

  /**
   * 把陣列整理成跟 quarters 一樣長：太短補 null、太長截掉、非數字變 null。
   * 回傳 { values, changed }，changed 表示有做過修正。
   */
  function normalizeValues(arr, length) {
    if (!Array.isArray(arr)) return null;
    const values = [];
    let changed = arr.length !== length;
    for (let i = 0; i < length; i++) {
      const raw = i < arr.length ? arr[i] : null;
      const v = cleanValue(raw);
      if (v === null && raw != null) changed = true;
      values.push(v);
    }
    return { values, changed };
  }

  function normalizeSeries(s, length, where, warnings) {
    if (!s || typeof s !== 'object') { warnings.push(where + '：不是物件，略過'); return null; }
    if (typeof s.id !== 'string' || !s.id) { warnings.push(where + '：缺少 id，略過'); return null; }
    const name = where + ' ' + s.id;
    const norm = normalizeValues(s.values, length);
    if (!norm) { warnings.push(name + '：values 不是陣列，略過'); return null; }
    if (norm.changed) warnings.push(name + '：values 長度或內容不符，已補齊或清掉非數字');
    if (norm.values.every(v => v == null)) { warnings.push(name + '：沒有任何數字，略過'); return null; }

    const out = {
      id: s.id,
      label: typeof s.label === 'string' && s.label ? s.label : s.id,
      color: typeof s.color === 'string' && COLOR_RE.test(s.color) ? s.color : FALLBACK_COLOR,
      home: !!s.home,
      values: norm.values,
    };
    // 預估區間：lo、mid、hi 三條都要能用才保留，否則只丟掉預估，實際線照畫
    if (s.fc != null) {
      const fc = {};
      const ok = ['lo', 'mid', 'hi'].every(k => {
        const n = s.fc && normalizeValues(s.fc[k], length);
        if (n) fc[k] = n.values;
        return !!n;
      });
      if (ok) out.fc = fc;
      else warnings.push(name + '：預估資料格式不對，只畫實際數字');
    }
    return out;
  }

  /**
   * 檢查並整理嵌入資料。
   * 回傳 { data, warnings }；整份無法使用時回傳 { error, warnings }。
   */
  function validateData(raw) {
    const warnings = [];
    if (raw == null) return { error: '沒有讀到資料，可能是 JSON 格式錯誤或資料區塊不見了', warnings };
    if (typeof raw !== 'object' || Array.isArray(raw)) return { error: '資料格式不對，應該是一個物件', warnings };

    const quarters = raw.quarters;
    if (!Array.isArray(quarters) || !quarters.length || !quarters.every(q => typeof q === 'string' && QUARTER_RE.test(q))) {
      return { error: '季別清單（quarters）缺少或格式不對', warnings };
    }
    const n = quarters.length;

    const views = {};
    const rawViews = raw.views && typeof raw.views === 'object' ? raw.views : {};
    for (const vid of VIEW_IDS) {
      const v = rawViews[vid];
      const list = v && Array.isArray(v.series) ? v.series : [];
      if (!v) warnings.push('views.' + vid + '：缺少，這個分頁會顯示空狀態');
      const series = list.map((s, i) => normalizeSeries(s, n, 'views.' + vid + '[' + i + ']', warnings)).filter(Boolean);
      views[vid] = { unit: v && v.unit === 'eur' ? 'eur' : 'index', series };
    }
    if (VIEW_IDS.every(vid => views[vid].series.length === 0)) {
      return { error: '所有資料組都沒有可用的序列', warnings };
    }

    // 最新實際季：缺少或不在清單裡時，改用有資料的最後一季
    let lastActual = raw.lastActual;
    if (!quarters.includes(lastActual)) {
      let li = -1;
      for (const vid of VIEW_IDS) for (const s of views[vid].series) {
        if (s.home) continue;
        for (let i = n - 1; i > li; i--) if (s.values[i] != null) { li = i; break; }
      }
      lastActual = quarters[Math.max(li, 0)];
      warnings.push('lastActual 不在季別清單裡，改用 ' + lastActual);
    }

    const homeArea = typeof raw.homeArea === 'number' && raw.homeArea > 0 ? raw.homeArea : null;
    const he = raw.homeEnd;
    const homeEnd = he && cleanValue(he.lo) != null && cleanValue(he.hi) != null ? { lo: he.lo, mid: cleanValue(he.mid), hi: he.hi } : null;
    if (homeArea == null || homeEnd == null) warnings.push('homeArea 或 homeEnd 缺少，不顯示「我家」重點句');

    return { data: { quarters, lastActual, homeArea, homeEnd, generated: raw.generated || null, views }, warnings };
  }

  /** 從 <script type="application/json"> 讀資料，JSON 壞掉時回傳 null */
  function readEmbeddedData(id) {
    const el = document.getElementById(id);
    if (!el) return null;
    try { return JSON.parse(el.textContent); } catch { return null; }
  }

  /** 動態載入一支 script，逾時或失敗都 reject */
  function loadScript(src, timeoutMs) {
    return new Promise((resolve, reject) => {
      const el = document.createElement('script');
      let done = false;
      const finish = (ok, why) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (ok) resolve(); else { el.remove(); reject(new Error(why + '：' + src)); }
      };
      const timer = setTimeout(() => finish(false, '逾時'), timeoutMs);
      el.src = src;
      el.async = true;
      el.onload = () => finish(true);
      el.onerror = () => finish(false, '載入失敗');
      document.head.appendChild(el);
    });
  }

  /**
   * 依序嘗試每個來源，直到 window.Chart 出現。
   * 預設先用 cdnjs，失敗再用 vendor/ 裡同版本的備份。
   */
  async function loadChartLib(sources, timeoutMs = 8000) {
    if (typeof window !== 'undefined' && window.Chart) return window.Chart;
    let lastErr = null;
    for (const src of sources) {
      try {
        await loadScript(src, timeoutMs);
        if (window.Chart) return window.Chart;
        lastErr = new Error('載入後找不到 Chart：' + src);
      } catch (e) {
        lastErr = e;
        console.warn('[圖表元件]', e.message);
      }
    }
    throw lastErr || new Error('沒有可用的 Chart.js 來源');
  }

  return { validateData, normalizeValues, readEmbeddedData, loadScript, loadChartLib };

<script>/*
 * 資料轉換層：純函式，不碰 DOM，也不依賴 Chart.js。
 * 瀏覽器裡掛在 window.HousingTransform，Node 測試裡用 require() 取得。
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.HousingTransform = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- 格式化 ----------

  /** '2022Q2' 轉成「2022 年第 2 季」 */
  const qLabel = q => q.slice(0, 4) + ' 年第 ' + q.slice(5) + ' 季';

  /** '2022Q2' 轉成「2022 Q2」，用在表頭等窄欄位 */
  const qShort = q => q.replace('Q', ' Q');

  /** 歐元用千分位整數，指數保留一位小數 */
  const fmtRaw = (v, unit) => (unit === 'eur' ? '€' + Math.round(v).toLocaleString('en-US') : v.toFixed(1));

  /** 百分比，正數加上 + 號 */
  const fmtPct = v => (v > 0 ? '+' : '') + v.toFixed(1) + '%';

  /**
   * 歐元金額轉成「€38 萬 9」這種口語寫法（解析度一千歐元，取絕對值）。
   * 先四捨五入到千元再拆萬位，避免 38.95 萬被拆成「38 萬 10」。
   */
  function fmtWan(v) {
    const k = Math.round(Math.abs(v) / 1000);
    const wan = Math.floor(k / 10);
    const rest = k % 10;
    return '€' + wan + ' 萬' + (rest ? ' ' + rest : '');
  }

  // ---------- 序列運算 ----------

  /** 四季移動平均；窗口內任何一季缺值，那一季就回傳 null */
  function smoothSeries(vals, size = 4) {
    return vals.map((v, i) => {
      if (v == null || i < size - 1) return null;
      let sum = 0;
      for (let k = i - size + 1; k <= i; k++) {
        if (vals[k] == null) return null;
        sum += vals[k];
      }
      return sum / size;
    });
  }

  /** 以 base 為 0% 換算漲幅；base 或該點缺值時為 null */
  function toPct(vals, base) {
    return vals.map(v => (v == null || base == null || base === 0 ? null : (v / base - 1) * 100));
  }

  /** 第一個非空值的位置，全空回傳 -1 */
  const firstIndex = vals => vals.findIndex(v => v != null);

  /** 在 idx 之前（含）最後一個非空值的位置，找不到回傳 -1 */
  function lastIndexAtOrBefore(vals, idx) {
    for (let i = Math.min(idx, vals.length - 1); i >= 0; i--) if (vals[i] != null) return i;
    return -1;
  }

  /**
   * 圖表 x 軸從哪一季開始：所有一般序列（非「我家」這類單點序列）最早有資料的那一季。
   * 全部序列都沒資料時回傳 0，避免 slice(-1) 只剩一個點。
   */
  function chartStartIndex(series) {
    const idx = series.filter(s => !s.home).map(s => firstIndex(s.values)).filter(i => i >= 0);
    return idx.length ? Math.min(...idx) : 0;
  }

  /**
   * 可選的基準季：參考序列有值、不晚於最新實際季，平滑時還要湊滿四季。
   * 參考序列 = 第一條一般序列（與原本行為相同）。
   */
  function availableBases(series, quarters, lastIdx, smooth) {
    const ref = series.find(s => !s.home);
    if (!ref) return [];
    const first = firstIndex(ref.values);
    return quarters.filter((q, i) => i <= lastIdx && ref.values[i] != null && (!smooth || i - first >= 3));
  }

  /** 目前的基準季若不可用，改用 preferred，再不行用第一個可用季 */
  function resolveBase(current, bases, preferred) {
    if (bases.includes(current)) return current;
    if (bases.includes(preferred)) return preferred;
    return bases.length ? bases[0] : null;
  }

  /**
   * 把一個 view 的原始序列換算成畫面要的數字：
   * vals（平滑後或原始）、pct（對基準季漲幅）、b（基準值）、fcp（預估的漲幅版本）。
   * 「我家」這類 home 序列只有零星幾點，不做平滑。
   */
  function prepareSeries(series, quarters, base, smooth) {
    const bi = quarters.indexOf(base);
    return series.map(s => {
      const vals = smooth && !s.home ? smoothSeries(s.values) : s.values;
      const b = bi >= 0 ? vals[bi] : null;
      const fcp = s.fc ? { lo: toPct(s.fc.lo, b), mid: toPct(s.fc.mid, b), hi: toPct(s.fc.hi, b) } : null;
      return Object.assign({}, s, { vals, pct: toPct(vals, b), b, fcp });
    });
  }

  /**
   * 表格列：每條顯示中的線，從基準季到「最新實際季」的漲幅，由高到低。
   * 有些線（例如「我家」）最新實際季沒有點，改用該季之前最近的一點，並記下是哪一季。
   */
  function tableRows(prepared, quarters, lastIdx, hidden) {
    return prepared
      .filter(s => !hidden[s.id] && s.b != null)
      .map(s => {
        const li = lastIndexAtOrBefore(s.vals, lastIdx);
        if (li < 0) return null;
        return { s, base: s.b, latest: s.vals[li], latestQuarter: quarters[li], stale: li !== lastIdx, chg: (s.vals[li] / s.b - 1) * 100 };
      })
      .filter(Boolean)
      .sort((a, b) => b.chg - a.chg);
  }

  /**
   * 「我家」重點句要用的數字（總價，歐元）。
   * 現值取最新實際季以前最近的一個點（目前是 2026Q2 銀行估價），不是固定取最新季，
   * 否則最新季沒有估價時會算成 0。
   */
  function homeOutlook(homeSeries, lastIdx, homeEnd, area) {
    if (!homeSeries || !homeEnd || !(area > 0)) return null;
    const li = lastIndexAtOrBefore(homeSeries.values, lastIdx);
    if (li < 0 || homeEnd.lo == null || homeEnd.hi == null) return null;
    const cur = homeSeries.values[li] * area;
    return { cur, lo: homeEnd.lo * area, hi: homeEnd.hi * area, index: li };
  }

  /** 紅字重點句 */
  function keyMessage(view, outlook) {
    if (view === 'm2') {
      if (!outlook) return '';
      const { cur, lo, hi } = outlook;
      const loss = cur - lo;
      const gain = hi - cur;
      return (
        '我家到 2028 年底預估 ' + fmtWan(lo) + ' 到 ' + fmtWan(hi) + '（現在 ' + fmtWan(cur) + '）。' +
        '再等兩年的輸贏：' + (loss >= 0 ? '少 ' : '多 ') + fmtWan(loss) + ' 到 ' + (gain >= 0 ? '多 ' : '少 ') + fmtWan(gain) + '。' +
        '等不到大漲，也不太會大跌。'
      );
    }
    return '全荷蘭 2027 年銀行預估漲 1% 到 3.5%。阿姆斯特丹預估持平，2028 年才可能小漲。';
  }

  return {
    qLabel, qShort, fmtRaw, fmtPct, fmtWan,
    smoothSeries, toPct, firstIndex, lastIndexAtOrBefore, chartStartIndex,
    availableBases, resolveBase, prepareSeries, tableRows, homeOutlook, keyMessage,
  };
});

  const T = window.HousingTransform;
  const D = window.HousingData;

  const CHART_SOURCES = [
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js',
    'vendor/chart.umd.js',
  ];
  const DEFAULT_BASE = '2022Q2'; // 買房那一季
  const DEFAULT_ON = { m2: ['home', 'nvm_city_m2'], cbs: ['cbs_amsterdam', 'cbs_nl'] };
  const VIEW_TEXT = { m2: '阿姆斯特丹各區公寓每 m² 價格', cbs: '荷蘭各地房價指數' };
  const FORECAST_NOTE =
    ' 虛線和淡色區塊是到 2028 年底的預估範圍。全荷蘭用銀行預測（ABN AMRO、Rabobank、ING、荷蘭央行，2026 年 6 月到 10 月發布）。' +
    '沒有銀行針對阿姆斯特丹做預測，阿姆斯特丹和我家的範圍是依這些報告做的判斷，不是保證。';

  const $ = id => document.getElementById(id);
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  let DATA = null;
  let Q = [];
  let LI = 0;
  let chart = null;
  let chartLib = null; // Chart.js 載入成功後才有值
  const state = { view: 'm2', mode: 'pct', base: DEFAULT_BASE, smooth: false, hidden: {} };

  // ---------- 狀態訊息 ----------

  /** 整頁無法使用時：隱藏控制項，只留錯誤訊息 */
  function showFatal(message) {
    document.body.classList.add('is-fatal');
    const el = $('fatal');
    el.hidden = false;
    el.querySelector('[data-msg]').textContent = message;
  }

  /** 圖表區的覆蓋訊息：loading、error、empty，或傳 null 清掉 */
  function setChartStatus(kind, message) {
    const box = $('chart-status');
    const retry = $('chart-retry');
    if (!kind) { box.hidden = true; box.dataset.kind = ''; return; }
    box.hidden = false;
    box.dataset.kind = kind;
    box.querySelector('[data-msg]').textContent = message;
    retry.hidden = kind !== 'error';
  }

  // ---------- 各區塊渲染 ----------

  function renderBaseSelect(bases) {
    const sel = $('base');
    sel.textContent = '';
    for (const q of bases) {
      const opt = document.createElement('option');
      opt.value = q;
      opt.textContent = T.qLabel(q) + (q === DEFAULT_BASE ? '（我買房那季）' : '');
      opt.selected = q === state.base;
      sel.appendChild(opt);
    }
    sel.disabled = bases.length === 0;
  }

  function renderLegend(series) {
    const box = $('legend');
    // 重畫前記住鍵盤焦點在哪一顆，重畫後放回去，否則按 Enter 之後焦點會掉到 body
    const focusedId = box.contains(document.activeElement) ? document.activeElement.dataset.id : null;
    box.textContent = '';
    for (const s of series) {
      const on = !state.hidden[s.id];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.id = s.id;
      btn.className = on ? '' : 'off';
      btn.setAttribute('aria-pressed', String(on));
      const sw = document.createElement('span');
      sw.className = 'sw';
      sw.setAttribute('aria-hidden', 'true');
      sw.style.background = s.home ? css('--home') : s.color;
      btn.append(sw, document.createTextNode(s.label));
      box.appendChild(btn);
    }
    if (focusedId) {
      const again = box.querySelector('button[data-id="' + CSS.escape(focusedId) + '"]');
      if (again) again.focus();
    }
  }

  function renderTable(prepared, unit) {
    $('th-base').textContent = state.base ? T.qShort(state.base) : '基準季';
    $('th-last').textContent = T.qShort(Q[LI]);
    const rows = T.tableRows(prepared, Q, LI, state.hidden);
    const tb = $('tb');
    tb.textContent = '';
    for (const r of rows) {
      const tr = document.createElement('tr');
      if (r.s.home) tr.className = 'home';
      const cells = [r.s.label, T.fmtRaw(r.base, unit), T.fmtRaw(r.latest, unit), T.fmtPct(r.chg)];
      cells.forEach((text, i) => {
        const td = document.createElement(i === 0 ? 'th' : 'td');
        if (i === 0) td.scope = 'row';
        td.textContent = text;
        if (i === 3) td.className = r.chg >= 0 ? 'up' : 'down';
        // 這條線最新實際季沒有點（例如「我家」），標出實際用的是哪一季
        if (i === 2 && r.stale) {
          const asof = document.createElement('small');
          asof.className = 'asof';
          asof.textContent = T.qShort(r.latestQuarter);
          td.append(' ', asof);
        }
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    }
    $('table-empty').hidden = rows.length > 0;
  }

  function renderText(viewSeries) {
    const home = viewSeries.find(s => s.id === 'home');
    const outlook = state.view === 'm2' ? T.homeOutlook(home, LI, DATA.homeEnd, DATA.homeArea) : null;
    $('key').textContent = T.keyMessage(state.view, outlook);
    const updated = '實際數字更新到 ' + T.qLabel(Q[LI]) + '。';
    $('note').textContent =
      (state.view === 'm2'
        ? '資料：NVM 與 MVA 季報，公寓成交中位價每平方公尺，只算中古屋。小區每季成交件數少，單季會跳，看趨勢比較準。「我家」只有兩個點：買入價與 2026 年銀行估價，換算成每平方公尺。' + updated
        : '資料：荷蘭統計局 CBS 既有住宅價格指數（2020 年 = 100），所有房型。區域是 CBS 的統計區，不是單一城市。' + updated) + FORECAST_NOTE;
  }

  /** 給螢幕閱讀器的圖表摘要，跟著目前顯示的線更新 */
  function chartAriaLabel(prepared) {
    const on = prepared.filter(s => !state.hidden[s.id]).map(s => s.label);
    return '線圖：' + VIEW_TEXT[state.view] + '逐季' + (state.mode === 'pct' ? '漲幅' : '數字') +
      '，含到 2028 年底的預估。目前顯示：' + (on.length ? on.join('、') : '無') + '。各線數字見下方表格。';
  }

  // ---------- Chart.js 設定 ----------

  /** 每個年份標籤大約需要 36px，不夠就每 2 年（或更多）標一次 */
  function yearStep(width, labels) {
    const years = labels.filter(q => q.endsWith('Q1')).length || 1;
    return Math.max(1, Math.ceil((36 * years) / Math.max(width, 1)));
  }

  function buildChartConfig(prepared, firstIdx, unit) {
    const labels = Q.slice(firstIdx);
    const lastLabelIdx = labels.indexOf(Q[LI]);
    const muted = css('--muted');
    const line = css('--line');
    const homeColor = css('--home');
    const pctMode = state.mode === 'pct';

    const datasets = prepared.map(s => {
      const color = s.home ? homeColor : s.color;
      return {
        label: s.label, data: (pctMode ? s.pct : s.vals).slice(firstIdx),
        _raw: s.vals.slice(firstIdx), _pct: s.pct.slice(firstIdx),
        borderColor: color, backgroundColor: color, borderWidth: s.home ? 3 : 2, borderDash: s.home ? [6, 4] : [],
        pointRadius: s.home ? 5 : 2.5, pointHoverRadius: s.home ? 7 : 5, pointStyle: s.home ? 'rectRot' : 'circle',
        spanGaps: !!s.home, tension: 0, hidden: !!state.hidden[s.id], _id: s.id,
      };
    });

    // 預估：低、高兩條細線中間填色，再加一條中位虛線
    for (const s of prepared) {
      if (!s.fc || state.hidden[s.id]) continue;
      const color = s.home ? homeColor : s.color;
      const pick = k => (pctMode ? s.fcp[k] : s.fc[k]).slice(firstIdx);
      const common = { borderColor: color, backgroundColor: color + '22', pointRadius: 0, pointHoverRadius: 0, tension: 0, _fc: true, _id: s.id };
      datasets.push(Object.assign({}, common, { label: s.label + ' 預估低', data: pick('lo'), borderWidth: 1, borderDash: [2, 3], fill: false, _band: 'lo' }));
      datasets.push(Object.assign({}, common, { label: s.label + ' 預估高', data: pick('hi'), borderWidth: 1, borderDash: [2, 3], fill: '-1', _band: 'hi' }));
      datasets.push(Object.assign({}, common, {
        label: s.label + ' 預估', data: pick('mid'), borderWidth: 2, borderDash: [5, 4], pointRadius: 2, pointHoverRadius: 5, _band: 'mid',
        _raw: s.fc.mid.slice(firstIdx), _pct: s.fcp.mid.slice(firstIdx),
        _lo: s.fc.lo.slice(firstIdx), _hi: s.fc.hi.slice(firstIdx), _plo: s.fcp.lo.slice(firstIdx), _phi: s.fcp.hi.slice(firstIdx),
      }));
    }

    // 「← 實際 | 預估 →」分隔線
    const nowLine = {
      id: 'nowLine',
      afterDraw(c) {
        if (lastLabelIdx < 0) return;
        const x = c.scales.x.getPixelForValue(lastLabelIdx);
        const a = c.chartArea;
        const g = c.ctx;
        g.save();
        g.strokeStyle = muted; g.setLineDash([3, 3]);
        g.beginPath(); g.moveTo(x, a.top); g.lineTo(x, a.bottom); g.stroke();
        g.setLineDash([]); g.fillStyle = muted; g.font = '12px -apple-system,sans-serif';
        g.textAlign = 'left'; g.fillText('預估 →', x + 6, a.top + 12);
        g.textAlign = 'right'; g.fillText('← 實際', x - 6, a.top + 12);
        g.restore();
      },
    };

    const tooltipLabel = c => {
      const ds = c.dataset;
      const i = c.dataIndex;
      if (ds._fc) {
        let t = ds.label + '：' + T.fmtRaw(ds._lo[i], unit) + ' 到 ' + T.fmtRaw(ds._hi[i], unit);
        if (ds._plo[i] != null && ds._phi[i] != null) t += '（' + T.fmtPct(ds._plo[i]) + ' 到 ' + T.fmtPct(ds._phi[i]) + '）';
        return t;
      }
      let t = ds.label + '：' + T.fmtRaw(ds._raw[i], unit);
      if (ds._pct[i] != null) t += '，' + T.fmtPct(ds._pct[i]);
      return t;
    };

    return {
      type: 'line',
      data: { labels, datasets },
      plugins: [nowLine],
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            itemSort: (a, b) => (b.parsed.y ?? -1e9) - (a.parsed.y ?? -1e9),
            // 實際線全部顯示；預估只顯示中位線，而且只在預估季
            filter: i => i.parsed.y != null && (!i.dataset._fc || (i.dataset._band === 'mid' && i.dataIndex > lastLabelIdx)),
            callbacks: {
              title: items => (items.length ? T.qLabel(items[0].label) + (state.base ? '（對比 ' + T.qLabel(state.base) + '）' : '') : ''),
              label: tooltipLabel,
            },
          },
        },
        scales: {
          x: {
            ticks: {
              color: muted, autoSkip: false, maxRotation: 0,
              // 只在每年第 1 季標年份；寬度不夠時（手機看 2016 起的指數）隔年標一次，避免文字重疊
              callback(v) {
                const q = this.getLabelForValue(v);
                if (!q.endsWith('Q1')) return '';
                const step = yearStep(this.chart.width, labels);
                return (Number(q.slice(0, 4)) - Number(labels[0].slice(0, 4))) % step === 0 ? q.slice(0, 4) : '';
              },
            },
            grid: { display: false },
          },
          y: {
            ticks: { color: muted, callback: v => (pctMode ? (v > 0 ? '+' : '') + v + '%' : unit === 'eur' ? '€' + v.toLocaleString('en-US') : v) },
            grid: { color: ctx => (pctMode && ctx.tick.value === 0 ? muted : line) },
          },
        },
      },
    };
  }

  function renderChart(prepared, firstIdx, unit) {
    const canvas = $('c');
    canvas.setAttribute('aria-label', chartAriaLabel(prepared));
    if (!chartLib) return; // 還在載入或載入失敗，狀態訊息已經顯示
    if (chart) { chart.destroy(); chart = null; }
    if (!prepared.length) { setChartStatus('empty', '這個資料組目前沒有可顯示的數字。'); return; }
    if (prepared.every(s => state.hidden[s.id])) {
      setChartStatus('empty', '目前沒有選任何一條線。點上方的地區按鈕加回來。');
    } else {
      setChartStatus(null);
    }
    try {
      chart = new chartLib(canvas, buildChartConfig(prepared, firstIdx, unit));
    } catch (e) {
      console.error('[圖表]', e);
      setChartStatus('error', '圖表畫不出來。下方表格的數字仍可使用。');
    }
  }

  // ---------- 主流程 ----------

  /** 依目前 state 重畫全部 */
  function render() {
    const view = DATA.views[state.view];
    const bases = T.availableBases(view.series, Q, LI, state.smooth);
    state.base = T.resolveBase(state.base, bases, DEFAULT_BASE);
    renderBaseSelect(bases);

    const prepared = T.prepareSeries(view.series, Q, state.base, state.smooth);
    const firstIdx = T.chartStartIndex(view.series);
    renderLegend(view.series);
    renderTable(prepared, view.unit);
    renderText(view.series);
    renderChart(prepared, firstIdx, view.unit);
  }

  /** 兩顆一組的切換按鈕（aria-pressed） */
  function bindSegment(idA, idB, key, valA, valB) {
    const a = $(idA);
    const b = $(idB);
    const set = v => {
      state[key] = v;
      a.setAttribute('aria-pressed', String(v === valA));
      b.setAttribute('aria-pressed', String(v === valB));
      render();
    };
    a.addEventListener('click', () => set(valA));
    b.addEventListener('click', () => set(valB));
  }

  function bindControls() {
    $('legend').addEventListener('click', e => {
      const btn = e.target.closest('button[data-id]');
      if (!btn) return;
      state.hidden[btn.dataset.id] = !state.hidden[btn.dataset.id];
      render();
    });
    bindSegment('v-m2', 'v-cbs', 'view', 'm2', 'cbs');
    bindSegment('m-pct', 'm-raw', 'mode', 'pct', 'raw');
    $('base').addEventListener('change', e => { state.base = e.target.value; render(); });
    $('smooth').addEventListener('change', e => { state.smooth = e.target.checked; render(); });
    $('chart-retry').addEventListener('click', loadChart);
    // 系統切換深淺色時，圖表顏色要跟著換
    const mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', render);
  }

  function loadChart() {
    setChartStatus('loading', '圖表載入中…');
    D.loadChartLib(CHART_SOURCES)
      .then(lib => { chartLib = lib; render(); })
      .catch(err => {
        console.error('[圖表元件]', err);
        setChartStatus('error', '圖表元件載入失敗，可能是網路不穩或被擋廣告外掛擋下。下方表格的數字仍可使用。');
      });
  }

  function init() {
    const result = D.validateData(D.readEmbeddedData('housing-data'));
    result.warnings.forEach(w => console.warn('[資料]', w));
    if (result.error) {
      showFatal('資料讀取失敗（' + result.error + '）。請重新產生 index.html 或稍後再試。');
      return;
    }
    DATA = result.data;
    Q = DATA.quarters;
    LI = Q.indexOf(DATA.lastActual);
    for (const vid in DATA.views) {
      for (const s of DATA.views[vid].series) if (!(DEFAULT_ON[vid] || []).includes(s.id)) state.hidden[s.id] = true;
    }
    bindControls();
    // 表格與文字不需要 Chart.js，先畫出來；圖表等元件載入完再補上
    render();
    loadChart();
  }

  init();
})();
</script>
</body>
</html>
