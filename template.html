<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿姆斯特丹房價線圖</title>
<style>
/* 色彩：--muted 淺色模式由 #898781 加深到 #706f6a，文字對比 4.9:1，符合 WCAG AA */
:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#706f6a;--line:#e1e0d9;--home:#0b0b0b;--focus:#0b0b0b}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--line:#2c2c2a;--home:#f0efec;--focus:#f0efec}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--ink2);font-size:14px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:0 0 14px;font-size:14px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink2);font:inherit;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline-offset:-3px}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:100%}
label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;font-size:13px;color:var(--ink)}
.legend button{appearance:none;border:1px solid var(--ink2);background:transparent;font:inherit;color:inherit;display:inline-flex;gap:6px;align-items:center;cursor:pointer;padding:4px 10px;border-radius:999px;min-height:30px}
.legend button.off{border-color:var(--line);color:var(--muted)}
.legend button.off .sw{opacity:.3}
.hint{font-size:13px;color:var(--muted);margin:0 0 6px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block;flex:none}
.chart{position:relative;height:420px}
.chart canvas{max-width:100%}
/* 圖表區的載入中、錯誤、空狀態訊息，蓋在圖上 */
.chart-status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin:0;padding:16px;text-align:center;font-size:14px;color:var(--ink2);pointer-events:none}
.chart-status[hidden]{display:none}
.chart-status[data-kind="loading"],.chart-status[data-kind="error"]{background:var(--bg);border:1px dashed var(--line);border-radius:8px}
.chart-status[data-kind="error"]{color:var(--ink)}
.chart-status button{pointer-events:auto;appearance:none;font:inherit;color:var(--bg);background:var(--ink);border:0;border-radius:8px;padding:6px 14px;cursor:pointer}
.table-wrap{overflow-x:auto;margin-top:22px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:500;color:var(--muted)}
tbody th{font-weight:400;color:inherit}
tr.home th,tr.home td{font-weight:600}
.asof{font-size:12px;font-weight:400;color:var(--muted)}
@media (max-width:560px){.asof{display:block}}
.table-empty{margin:8px 0 0;font-size:14px;color:var(--muted)}
.up{color:#0a7d3c}.down{color:#c0392b}
@media (prefers-color-scheme: dark){.up{color:#4cc38a}.down{color:#f08a7c}}
.key{margin:14px 0 0;color:#c0392b;font-weight:600;font-size:15px}
.key:empty{display:none}
@media (prefers-color-scheme: dark){.key{color:#f08a7c}}
.note{margin-top:20px;color:var(--muted);font-size:13px}
.note a{color:inherit}
.fatal{margin:24px 0;padding:16px;border:1px solid #c0392b;border-radius:8px;color:var(--ink)}
.fatal[hidden]{display:none}
.fatal p{margin:0}
body.is-fatal .app{display:none}
@media (max-width:560px){.chart{height:340px}.controls{gap:10px 16px}}
</style>
</head>
<body>
<main>
<h1>阿姆斯特丹房價線圖</h1>
<p class="sub">每一季一個點。滑鼠移上去，看每一區從基準季到那一季漲了多少。</p>

<div class="fatal" id="fatal" role="alert" hidden><p data-msg></p></div>

<!-- 沒有 JavaScript 時的提示 -->
<noscript><p class="fatal">這個頁面需要開啟 JavaScript 才能顯示圖表與表格。</p></noscript>

<div class="app">
<div class="controls">
  <div class="seg" role="group" aria-label="資料">
    <button type="button" id="v-m2" aria-pressed="true">各區公寓每 m²</button>
    <button type="button" id="v-cbs" aria-pressed="false">各地房價指數</button>
  </div>
  <div class="seg" role="group" aria-label="顯示">
    <button type="button" id="m-pct" aria-pressed="true">漲幅 %</button>
    <button type="button" id="m-raw" aria-pressed="false">原始數字</button>
  </div>
  <label for="base">基準季 <select id="base"></select></label>
  <label><input type="checkbox" id="smooth"> 平滑（四季平均）</label>
</div>

<p class="hint" id="legend-hint">點一下加入或拿掉一條線</p>
<div class="legend" id="legend" role="group" aria-labelledby="legend-hint"></div>
<div class="chart">
  <canvas id="c" role="img" aria-label="阿姆斯特丹各區房價逐季線圖，含到 2028 年底的預估"></canvas>
  <div class="chart-status" id="chart-status" role="status" data-kind="loading">
    <p data-msg style="margin:0">圖表載入中…</p>
    <button type="button" id="chart-retry" hidden>重新載入圖表</button>
  </div>
</div>
<p class="key" id="key"></p>

<div class="table-wrap">
<table>
  <caption class="sr-only">各線從基準季到最新一季的漲幅，由高到低</caption>
  <thead><tr><th scope="col">地區</th><th scope="col" id="th-base">基準季</th><th scope="col" id="th-last">最新</th><th scope="col">漲幅</th></tr></thead>
  <tbody id="tb"></tbody>
</table>
</div>
<p class="table-empty" id="table-empty" hidden>目前沒有可比較的線。請在上方選一條有基準季數字的線。</p>

<p class="note" id="note"></p>
</div>
</main>

<!-- 資料由 build.py 從 data/series.json 產生後嵌入 -->
<script type="application/json" id="housing-data">/*DATA*/</script>
<!-- 程式碼由 build.py 從 src/ 嵌入：資料取得、資料轉換、畫面渲染 -->
<script>/*INLINE:src/data.js*/</script>
<script>/*INLINE:src/transform.js*/</script>
<script>/*INLINE:src/render.js*/</script>
</body>
</html>
